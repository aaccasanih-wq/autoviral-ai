[project]
name = "autoviral-ai"
version = "1.0.0"
description = "Pipeline automatizado y modular para la creacion de videos cortos (Shorts, Reels, TikTok) impulsado por IA."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AutoViral AI" }]
dependencies = [
    "edge-tts>=6.1.0",
    "faster-whisper>=1.0.0",
    "google-genai>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
kinocut = ["kinocut>=1.15.0"]

[project.scripts]
autoviral = "scripts.pipeline:main"

[tool.setuptools]
packages = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py39"
